pluginManagement {
    def localMaven = System.getenv('MITV_LOCAL_MAVEN')
    repositories {
        if (localMaven && file(localMaven).isDirectory()) {
            maven { url = uri(localMaven) }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
