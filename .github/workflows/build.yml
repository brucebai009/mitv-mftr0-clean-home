name: Build TVHome

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK 34
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          if [ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" ] || [ ! -f "$ANDROID_HOME/build-tools/34.0.0/source.properties" ]; then
            yes | "$manager" "--sdk_root=$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-34/source.properties"
          test -f "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > launcher/local.properties
      - name: Test, lint and build
        working-directory: launcher
        shell: bash
        run: |
          set -uo pipefail
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest lintRelease assembleRelease 2>&1 | tee ../build-output.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tvhome-build-diagnostics
          path: build-output.log
          if-no-files-found: error
          retention-days: 3
      - name: Publish build failure summary
        if: failure()
        shell: bash
        run: |
          set -u
          if [ -f build-output.log ]; then
            {
              echo '### Gradle failure excerpt'
              echo '```text'
              tail -n 120 build-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E 'FAILURE:|What went wrong|Execution failed|error:|> Task .*FAILED|Could not resolve' build-output.log | tail -n 25 | while IFS= read -r line; do
              safe=${line:0:900}
              echo "::error title=Gradle failure::$safe"
            done
            tail -n 60 build-output.log | while IFS= read -r line; do
              [ -n "$line" ] || continue
              safe=${line:0:900}
              echo "::warning title=Gradle tail::$safe"
            done
          fi
          report='launcher/app/build/reports/lint-results-release.xml'
          if [ -f "$report" ]; then
            python3 - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report = sys.argv[1]
          root = ET.parse(report).getroot()
          for issue in root.findall('issue'):
              if issue.attrib.get('severity') not in {'error', 'fatal'}:
                  continue
              location = issue.find('location')
              path = location.attrib.get('file', report) if location is not None else report
              line = ''
              if location is not None:
                  line = (location.attrib.get('line') or '').strip()
              message = issue.attrib.get('message', 'lint error')
              issue_id = issue.attrib.get('id', 'Lint')
              suffix = f" file={path}"
              if line.isdigit():
                  suffix += f" line={line}"
              print(f"::error title={issue_id}{suffix}::{message[:900]}")
          PY
          fi
      - name: Check product artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f launcher/app/build/outputs/apk/release/app-release-unsigned.apk
          # Gradle needs this local-only SDK pointer during the build; it is never a public source file.
          rm -f launcher/local.properties
          python3 scripts/check_public_release.py --source . --apk launcher/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum launcher/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tvhome-unsigned
          path: launcher/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
