name: Build TVHome

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK 34
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          if [ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" ] || [ ! -f "$ANDROID_HOME/build-tools/34.0.0/source.properties" ]; then
            yes | "$manager" "--sdk_root=$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-34/source.properties"
          test -f "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > launcher/local.properties
      - name: Test, lint and build
        working-directory: launcher
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Check product artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f launcher/app/build/outputs/apk/release/app-release-unsigned.apk
          # Gradle needs this local-only SDK pointer during the build; it is never a public source file.
          rm -f launcher/local.properties
          python3 scripts/check_public_release.py --source . --apk launcher/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum launcher/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tvhome-unsigned
          path: launcher/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
      - name: Publish unsigned handoff branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="ci-artifacts/${GITHUB_SHA}/TVHome-MFTR0-1.0.0-v13.2-unsigned.apk"
          publish_branch="ci-unsigned-v13.2"
          # Keep the public handoff branch artifact-only. The source commit now contains
          # release workflows, and GITHUB_TOKEN cannot create a branch commit that adds
          # workflow files without the separate workflow scope.
          git switch --orphan "$publish_branch"
          git rm -r --cached . >/dev/null 2>&1 || true
          mkdir -p "$(dirname "$target")"
          cp launcher/app/build/outputs/apk/release/app-release-unsigned.apk "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$target"
          git commit -m "ci: publish unsigned handoff artifact ${GITHUB_SHA::12}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${publish_branch}"
